<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Manage Photos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="/">← Back to site</a>
    <nav><button class="btn" id="sign-out" hidden>Sign out</button></nav>
  </header>
  <main>
    <section class="hero">
      <h1>Photos</h1>
      <p class="headline">Set your headshot, and add, caption, or remove the photos shown under each job.</p>

      <form class="admin-login" id="login">
        <label for="password">Password</label>
        <div class="row">
          <input type="password" id="password" autocomplete="current-password" required>
          <button class="btn primary" type="submit">Sign in</button>
        </div>
        <p class="admin-msg" id="login-msg" role="status"></p>
      </form>
    </section>

    <div id="jobs" hidden>
      <section class="admin-job" id="headshot-section">
        <h2>Your headshot</h2>
        <p class="when">Shown next to your name, in the contact section, and in the chat window. Square photos work best.</p>
        <div class="headshot-row">
          <div class="avatar avatar-lg" id="headshot-preview"></div>
          <form class="admin-upload" id="headshot-form">
            <input type="file" id="headshot-file" accept="image/*" required>
            <div class="row">
              <button class="btn primary" type="submit">Upload headshot</button>
              <button class="btn danger" type="button" id="headshot-remove" hidden>Remove</button>
            </div>
            <p class="admin-msg" id="headshot-msg" role="status"></p>
          </form>
        </div>
      </section>
      <div id="job-list"></div>
    </div>
  </main>
  <script src="admin.js" type="module"></script>
</body>
</html>
